# Makes the four stem models (Open-Unmix to LiteRT) on a Linux runner: ai-edge-torch, the
# converter, does not install on Windows, where the release is built. Run by hand; the models
# come back as an artifact and go under app/src/full/assets/models (git-ignored).
#
#   gh workflow run models.yml && gh run download --name stem-models -D app/src/full/assets/models
name: models

on:
  workflow_dispatch:

jobs:
  stems:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the converter
        run: pip install -r tools/models/requirements-umx.txt
      - name: Convert and check against PyTorch
        run: python tools/models/umx_to_tflite.py out
      - uses: actions/upload-artifact@v4
        with:
          name: stem-models
          path: out/*.tflite
          retention-days: 30
