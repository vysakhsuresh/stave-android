name: Release
# A tag v* builds the signed release APKs (full, with every model inside) and the Play bundle,
# after the engine suites, the unit tests and lint. Signing wants the owner's key in the
# repository secrets (STAVE_KEYSTORE_BASE64, STAVE_KEYSTORE_PASSWORD, STAVE_KEY_ALIAS,
# STAVE_KEY_PASSWORD); without them the job publishes unsigned builds marked as such.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to create and release, e.g. v0.1.0 (made at the dispatched commit)'
        required: true
permissions:
  contents: read
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  engine:
    name: Pure engine (no Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash tools/jvm/run.sh
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from the secrets, when there is one
        if: ${{ secrets.STAVE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.STAVE_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          cat > keystore.properties <<PROPS
          storeFile=$PWD/release.jks
          storePassword=${{ secrets.STAVE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.STAVE_KEY_ALIAS }}
          keyPassword=${{ secrets.STAVE_KEY_PASSWORD }}
          PROPS
      - name: Tests, lint, release APK and bundle
        run: ./gradlew :engine:test testFullDebugUnitTest lintFullDebug assembleFullRelease bundlePlayRelease --console plain
      - name: Verify merged privacy manifests
        run: python3 tools/verify_manifest.py
      - name: Name the files for the tag and sum them
        run: |
          mkdir -p out
          cp app/build/outputs/apk/full/release/*.apk "out/stave-${TAG}.apk"
          cp app/build/outputs/bundle/playRelease/*.aab "out/stave-${TAG}-play.aab"
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/
  publish:
    needs: [engine, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Stave $TAG" --notes-file release/NOTES.md --prerelease
