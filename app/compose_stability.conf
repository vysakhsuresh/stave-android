// Classes the Compose compiler may treat as stable, so a composable given an equal one skips.
//
// Only read-only, never-mutated-after-handing-over types belong here. A class listed here that is
// later mutated in place will make a composable keep showing the old content, because the
// compiler trusts equals and the instance has not changed. Squish's strip skipped a retyped
// caption for exactly that reason once.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
kotlin.ranges.LongRange
kotlin.ranges.IntRange
android.net.Uri
com.layerbit.stave.engine.**
